[package]
name = "toolkit"
version = "0.1.0"
description = "A production-ready Tauri v2 template for macOS desktop apps"
authors = ["xujunfa"]
edition = "2021"

[lib]
name = "toolkit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
dirs = "6"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
chrono = { version = "0.4", features = ["serde"] }

[target.'cfg(target_os = "macos")'.dependencies]
tray-icon = "0.21"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSDictionary", "NSAttributedString", "NSRange"] }
objc2-app-kit = { version = "0.3", features = ["NSFont", "NSFontDescriptor", "NSButton", "NSStatusItem", "NSStatusBar", "NSStatusBarButton", "NSControl", "NSParagraphStyle", "NSAttributedString", "objc2-core-foundation"] }
